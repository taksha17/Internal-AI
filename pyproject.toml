[project]
name = "internal-ai"
version = "0.1.0"
description = "Agent-driven in-house LLM build platform (orchestrator, role agents, gates, budgets, lineage)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
internal-ai = "internal_ai.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]
train = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internal_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/internal_ai/api.py" = ["B008"]
"src/internal_ai/serving/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
