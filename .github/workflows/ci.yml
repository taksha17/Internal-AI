name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,alpha]"
      - name: Secret scan
        run: python scripts/secret_scan.py .
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest
